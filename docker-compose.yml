version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-gateway-db
    environment:
      POSTGRES_DB: mcp_gateway
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

  redis:
    image: redis:7-alpine
    container_name: mcp-gateway-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-gateway
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://mcp_user:mcp_password@postgres:5432/mcp_gateway

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-env-file}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24

      # Gateway
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      LOG_LEVEL: INFO

      # Rate Limiting
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_PERIOD: 3600

      # Audit
      AUDIT_LOG_RETENTION_DAYS: 30
      PII_DETECTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  mcp-network:
    driver: bridge
