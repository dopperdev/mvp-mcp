# Example secrets file - DO NOT commit actual secrets to git
# Create actual secrets with: kubectl create secret generic mcp-gateway-secrets --from-literal=...

apiVersion: v1
kind: Secret
metadata:
  name: mcp-gateway-secrets
  namespace: mcp-gateway
type: Opaque
stringData:
  # Database
  postgres-user: "mcp_user"
  postgres-password: "CHANGE_ME_STRONG_PASSWORD"
  database-url: "postgresql://mcp_user:CHANGE_ME_STRONG_PASSWORD@postgres:5432/mcp_gateway"

  # Redis
  redis-password: "CHANGE_ME_REDIS_PASSWORD"
  redis-url: "redis://:CHANGE_ME_REDIS_PASSWORD@redis:6379/0"

  # JWT
  jwt-secret: "CHANGE_ME_JWT_SECRET_64_CHARS_MINIMUM"

  # Admin (only for initial setup)
  default-admin-password: "CHANGE_ME_ADMIN_PASSWORD"
